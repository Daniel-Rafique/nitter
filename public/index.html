<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koynlabs</title>
    
    <!-- Include the same CSS files that the Nim template uses -->
    <link rel="stylesheet" type="text/css" href="/css/style.css?v=19">
    <link rel="stylesheet" type="text/css" href="/css/fontello.css?v=2">
    <link rel="stylesheet" type="text/css" href="/css/koynlabs.css?v=1">
    
    <!-- Favicon links -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <!-- External scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Navigation bar similar to the one in general.nim -->
    <nav>
        <div class="inner-nav">
            <div class="nav-item">
                <a href="/"><img class="site-logo" src="/logo.jpg" alt="Koynlabs Logo"></a>
                <a class="site-name" href="/">Koynlabs</a>
            </div>
            <div class="nav-links">
                <a href="/search?q=Bitcoin" class="nav-link">Bitcoin</a>
                <a href="/search?q=Ethereum" class="nav-link">Ethereum</a>
                <a href="/search?q=Solana" class="nav-link">Solana</a>
                <a href="/search?q=DeFi" class="nav-link">DeFi</a>
            </div>
            <div class="nav-item right">
                <a href="/search?ai=true" title="AI-Powered Search" class="nav-item">
                    <div class="icon-search-ai">
                        <i class="icon-search"></i>
                        <span class="ai-indicator">AI</span>
                    </div>
                </a>
                <a href="/about" title="About" class="nav-item"><i class="icon-info"></i></a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Fixed search container at the bottom -->
        <div class="enhanced-search-container" id="searchContainer">
            <form id="sentimentForm" method="post" autocomplete="off" class="enhanced-search-form">
                <input type="text" name="question" autofocus placeholder="Search for insights..." dir="auto">
                <input type="hidden" name="limit" value="50">
                <button type="submit" class="search-button"><i class="icon-search"></i></button>
            </form>

            <!-- Results container with Koynlabs styling -->
            <div id="resultsContainer" style="display: none;" class="ai-search-results">
                <div class="ai-search-header">
                    <div class="asset-info">
                        <h2 id="assetName"></h2>
                        <div class="asset-price">Current Price: $<span id="assetPrice"></span></div>
                    </div>
                    <div id="sentimentBadge" class="sentiment-indicator"></div>
                </div>
                
                <div class="chart-container">
                    <img id="priceChart" src="" alt="Price Chart">
                </div>
                
                <div class="ai-search-summary">
                    <h3>Analysis</h3>
                    <div id="analysisText" class="analysis-content"></div>
                </div>
            </div>
            
            <div class="powered-by">
                Search Powered by <a href="https://koyn.ai" target="_blank">Koyn.ai</a>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const sentimentForm = document.getElementById('sentimentForm');
        const resultsContainer = document.getElementById('resultsContainer');
        const searchContainer = document.getElementById('searchContainer');
        
        sentimentForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Show loading indicator
            const loadingIndicator = document.createElement('div');
            loadingIndicator.className = 'loading-indicator';
            
            const spinner = document.createElement('div');
            spinner.className = 'loading-spinner';
            loadingIndicator.appendChild(spinner);
            
            const loadingText = document.createElement('span');
            loadingText.textContent = 'Analyzing...';
            loadingIndicator.appendChild(loadingText);
            
            sentimentForm.appendChild(loadingIndicator);
            
            // Get the question
            const questionInput = sentimentForm.querySelector('input[name="question"]');
            const question = questionInput.value;
            
            // Make the API request
            fetch('https://api.koynlabs.com:3003/api/sentiment', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ question })
            })
            .then(response => response.json())
            .then(data => {
                // Remove loading indicator
                sentimentForm.removeChild(loadingIndicator);
                
                // Display the results
                displayResults(data);
            })
            .catch(error => {
                console.error('Error:', error);
                sentimentForm.removeChild(loadingIndicator);
                alert('An error occurred while fetching results. Please try again.');
            });
        });
        
        function displayResults(data) {
            // Make sure we have results
            if (!data.results || data.results.length === 0) {
                alert('No results found. Please try a different query.');
                return;
            }
            
            const result = data.results[0];
            
            // Update asset name and price
            document.getElementById('assetName').textContent = result.asset.charAt(0).toUpperCase() + result.asset.slice(1);
            document.getElementById('assetPrice').textContent = result.asset_price;
            
            // Update sentiment badge with Koynlabs styling
            const sentimentBadge = document.getElementById('sentimentBadge');
            sentimentBadge.textContent = result.social_sentiment;
            
            // Apply appropriate color based on sentiment
            if (result.social_sentiment.toLowerCase() === 'positive') {
                sentimentBadge.style.backgroundColor = 'var(--koyn-secondary)';
            } else if (result.social_sentiment.toLowerCase() === 'negative') {
                sentimentBadge.style.backgroundColor = '#e74c3c';
            } else {
                sentimentBadge.style.backgroundColor = 'var(--koyn-bg-card)';
            }
            
            // Update price chart
            document.getElementById('priceChart').src = result.price_chart;
            
            // Update analysis text with hoverable news sources
            const analysisText = document.getElementById('analysisText');
            
            // First, store the original analysis text
            let analysisContent = result.analysis;
            
            // Store news data globally for tooltips
            if (data.news && data.news.length > 0) {
                window.latestNewsData = data.news;
                
                // Process the analysis text to fix the news source tags
                // Replace [SourceName] with properly formatted span tags
                const sourceRegex = /\[(.*?)\]/g;
                analysisContent = analysisContent.replace(sourceRegex, (match, sourceName) => {
                    return `<span class="news-source" data-source="${sourceName}">${sourceName}</span>`;
                });
                
                // Check if we need to add a sources section at the bottom
                if (!analysisContent.toLowerCase().includes('<div class="sources-section">')) {
                    // Extract any existing sources section in plain text format
                    let sourcesSection = '';
                    const sourcesSectionMatch = analysisContent.match(/\*\*Sources:\*\*\s*([\s\S]+)$/);
                    
                    if (sourcesSectionMatch) {
                        // Remove the plain text sources section from the content
                        analysisContent = analysisContent.replace(/\*\*Sources:\*\*\s*([\s\S]+)$/, '');
                        
                        // Create a properly formatted sources section
                        sourcesSection = '<div class="sources-section"><h4>Sources:</h4><ol class="sources-list">';
                        
                        // Try to parse the existing sources
                        const sourceLines = sourcesSectionMatch[1].trim().split(/\s*\d+\.\s*/).filter(line => line.trim());
                        
                        if (sourceLines.length > 0) {
                            sourceLines.forEach(line => {
                                // Extract URL and source name if available
                                const urlMatch = line.match(/\[(.*?)\]\((https?:\/\/[^\s)]+)\)/);
                                if (urlMatch) {
                                    const sourceName = urlMatch[1];
                                    const sourceUrl = urlMatch[2];
                                    
                                    // Find matching news item for title
                                    const matchingNews = window.latestNewsData.find(item => 
                                        item.source.toLowerCase().includes(sourceName.toLowerCase())
                                    );
                                    
                                    const title = matchingNews ? matchingNews.title : sourceName;
                                    sourcesSection += `<li><a href="${sourceUrl}" target="_blank">${sourceName}: ${title}</a></li>`;
                                } else {
                                    // Simple text entry
                                    sourcesSection += `<li>${line.trim()}</li>`;
                                }
                            });
                        } else {
                            // If we couldn't parse the existing sources, use our news data
                            data.news.forEach((newsItem, index) => {
                                sourcesSection += `<li><a href="${newsItem.url}" target="_blank">${newsItem.source}: ${newsItem.title}</a></li>`;
                            });
                        }
                        
                        sourcesSection += '</ol></div>';
                    } else {
                        // No existing sources section, create one from our news data
                        sourcesSection = '<div class="sources-section"><h4>Sources:</h4><ol class="sources-list">';
                        
                        data.news.forEach((newsItem, index) => {
                            sourcesSection += `<li><a href="${newsItem.url}" target="_blank">${newsItem.source}: ${newsItem.title}</a></li>`;
                        });
                        
                        sourcesSection += '</ol></div>';
                    }
                    
                    // Add the formatted sources section
                    analysisContent += sourcesSection;
                }
                
                // Process the analysis text to ensure proper formatting
                // Split by paragraphs and ensure proper spacing
                const paragraphs = analysisContent.split(/\n\n|\r\n\r\n/);
                if (paragraphs.length > 1) {
                    // If we already have paragraphs, make sure they're properly formatted
                    analysisContent = paragraphs.map(p => {
                        // Skip if it's already wrapped in a paragraph tag
                        if (p.trim().startsWith('<p>') && p.trim().endsWith('</p>')) {
                            return p;
                        }
                        // Skip the sources section we just added
                        if (p.includes('<div class="sources-section">')) {
                            return p;
                        }
                        return `<p>${p.trim()}</p>`;
                    }).join('');
                } else {
                    // If there's no clear paragraph structure, try to create it
                    // Split by sentences and group them into paragraphs
                    const sentences = analysisContent.split(/(?<=[.!?])\s+/);
                    const newParagraphs = [];
                    let currentParagraph = [];
                    
                    sentences.forEach((sentence, index) => {
                        currentParagraph.push(sentence);
                        
                        // Create a new paragraph every 2-3 sentences or if we detect a topic change
                        if ((currentParagraph.length >= 2 && index < sentences.length - 1) || 
                            sentence.includes('However,') || 
                            sentence.includes('In conclusion,') ||
                            sentence.includes('To summarize,')) {
                            newParagraphs.push(currentParagraph.join(' '));
                            currentParagraph = [];
                        }
                    });
                    
                    // Add any remaining sentences
                    if (currentParagraph.length > 0) {
                        newParagraphs.push(currentParagraph.join(' '));
                    }
                    
                    // Extract the sources section if it exists
                    const sourcesSection = analysisContent.match(/<div class="sources-section">[\s\S]*?<\/div>/);
                    
                    // Format paragraphs
                    analysisContent = newParagraphs.map(p => `<p>${p.trim()}</p>`).join('');
                    
                    // Add back the sources section
                    if (sourcesSection) {
                        analysisContent += sourcesSection[0];
                    }
                }
            }
            
            // Set the enhanced analysis text with embedded news sources
            analysisText.innerHTML = analysisContent;
            
            // Make the news source spans in the analysis text interactive
            setupNewsSourceHovers();
            
            // Show the results container
            resultsContainer.style.display = 'block';
            
            // Scroll to results at the top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        function setupNewsSourceHovers() {
            // Find all news source spans
            const newsSourceSpans = document.querySelectorAll('.news-source');
            
            newsSourceSpans.forEach(span => {
                const source = span.getAttribute('data-source');
                
                // Find matching news item
                const matchingNews = window.latestNewsData?.find(item => 
                    item.source.toLowerCase().includes(source.toLowerCase()) ||
                    source.toLowerCase().includes(item.source.toLowerCase())
                );
                
                if (matchingNews) {
                    // Create tooltip with Koynlabs styling
                    const tooltip = document.createElement('div');
                    tooltip.className = 'news-tooltip';
                    
                    tooltip.innerHTML = `
                        <strong class="tooltip-title">${matchingNews.title}</strong>
                        <p class="tooltip-description">${matchingNews.description || 'No description available.'}</p>
                        <small class="tooltip-source">Source: ${matchingNews.source}</small>
                        <div class="tooltip-footer">
                            <a href="${matchingNews.url}" target="_blank" class="read-more">Read Full Article</a>
        </div>
                    `;
                    
                    span.appendChild(tooltip);
                    
                    // Show/hide tooltip on hover with intelligent positioning
                    span.addEventListener('mouseenter', () => {
                        // Check position for optimal tooltip placement
                        const spanRect = span.getBoundingClientRect();
                        const tooltipHeight = tooltip.offsetHeight || 200; // Estimate if not rendered yet
                        
                        // Position based on available space
                        if (spanRect.top < tooltipHeight + 20) {
                            tooltip.classList.add('bottom');
                        } else {
                            tooltip.classList.remove('bottom');
                        }
                        
                        // Check horizontal position
                        const viewportWidth = window.innerWidth;
                        if (spanRect.left < 150) {
                            tooltip.classList.add('left');
                        } else if (viewportWidth - spanRect.right < 150) {
                            tooltip.classList.add('right');
                        }
                        
                        tooltip.style.display = 'block';
                    });
                    
                    span.addEventListener('mouseleave', () => {
                        tooltip.style.display = 'none';
                    });
                    
                    // Make clickable to open the news article
                    span.style.cursor = 'pointer';
                    span.addEventListener('click', () => {
                        window.open(matchingNews.url, '_blank');
                    });
                } else {
                    // If no matching news item found, create a generic tooltip
                    console.log(`No matching news item found for source: ${source}`);
                    
                    // Create a generic tooltip
                    const tooltip = document.createElement('div');
                    tooltip.className = 'news-tooltip';
                    
                    tooltip.innerHTML = `
                        <strong class="tooltip-title">${source}</strong>
                        <p class="tooltip-description">Source information not available.</p>
                    `;
                    
                    span.appendChild(tooltip);
                    
                    // Show/hide tooltip on hover
                    span.addEventListener('mouseenter', () => {
                        tooltip.style.display = 'block';
                    });
                    
                    span.addEventListener('mouseleave', () => {
                        tooltip.style.display = 'none';
                    });
                }
            });
        }
    });
    </script>

    <style>
    /* Enhanced styling for the results container */
    #resultsContainer {
        background-color: var(--koyn-bg-panel);
        color: var(--koyn-text);
        border-radius: var(--radius-lg);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        margin-top: var(--space-xl);
        margin-bottom: var(--space-xl);
        width: 100%;
        max-width: 800px;
        overflow: hidden;
    }
    
    /* Header styling */
    .ai-search-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-lg);
        border-bottom: 1px solid var(--koyn-border);
        background-color: var(--koyn-bg-card);
    }
    
    .asset-info {
        display: flex;
        flex-direction: column;
    }
    
    .ai-search-header h2 {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--koyn-text);
        margin-bottom: var(--space-xs);
    }
    
    .asset-price {
        color: var(--koyn-text-secondary);
        font-size: 1rem;
    }
    
    .sentiment-indicator {
        padding: var(--space-xs) var(--space-md);
        border-radius: var(--radius-md);
        font-weight: 600;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    /* Chart container styling */
    .chart-container {
        padding: var(--space-lg);
        background-color: var(--koyn-bg-panel);
        text-align: center;
    }
    
    .chart-container img {
        max-width: 100%;
        border-radius: var(--radius-md);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    }
    
    /* Analysis section styling */
    .ai-search-summary {
        padding: var(--space-lg);
    }
    
    .ai-search-summary h3 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-top: 0;
        margin-bottom: var(--space-md);
        color: var(--koyn-text);
        border-bottom: 1px solid var(--koyn-border);
        padding-bottom: var(--space-xs);
    }
    
    .analysis-content {
        line-height: 1.7;
        font-size: 1.05rem;
    }
    
    .analysis-content p {
        margin-bottom: var(--space-md);
    }
    
    /* News source styling */
    .news-source {
        color: var(--koyn-primary-light);
        font-weight: 500;
        position: relative;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        margin: 0 2px;
        padding: 0 4px;
        border-radius: 3px;
        background-color: rgba(99, 102, 241, 0.1);
        transition: all 0.2s ease;
    }
    
    .news-source:hover {
        background-color: rgba(99, 102, 241, 0.2);
        color: var(--koyn-primary);
    }
    
    /* Tooltip styling */
    .news-tooltip {
        z-index: 1000;
        width: 320px;
        padding: var(--space-md);
        border-radius: var(--radius-md);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        position: absolute;
        display: none;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        margin-bottom: 12px;
        background-color: var(--koyn-bg-panel);
        color: var(--koyn-text);
        border: 1px solid var(--koyn-border);
        text-align: left;
    }
    
    .news-tooltip:after {
        content: '';
        position: absolute;
        top: 100%;
        left: 50%;
        margin-left: -8px;
        border-width: 8px;
        border-style: solid;
        border-color: var(--koyn-bg-panel) transparent transparent transparent;
    }
    
    .news-tooltip.bottom {
        bottom: auto;
        top: 100%;
        margin-bottom: 0;
        margin-top: 12px;
    }
    
    .news-tooltip.bottom:after {
        top: auto;
        bottom: 100%;
        border-color: transparent transparent var(--koyn-bg-panel) transparent;
    }
    
    .news-tooltip.left {
        left: 0;
        transform: none;
    }
    
    .news-tooltip.left:after {
        left: 16px;
        margin-left: 0;
    }
    
    .news-tooltip.right {
        left: auto;
        right: 0;
        transform: none;
    }
    
    .news-tooltip.right:after {
        left: auto;
        right: 16px;
        margin-left: 0;
    }
    
    .tooltip-title {
        display: block;
        font-size: 1rem;
        margin-bottom: var(--space-sm);
        color: var(--koyn-primary-light);
        line-height: 1.4;
    }
    
    .tooltip-description {
        font-size: 0.9rem;
        margin: var(--space-sm) 0;
        color: var(--koyn-text-secondary);
        line-height: 1.5;
    }
    
    .tooltip-source {
        display: block;
        font-size: 0.8rem;
        color: var(--koyn-text-secondary);
        margin-top: var(--space-sm);
    }
    
    .tooltip-footer {
        margin-top: var(--space-md);
        padding-top: var(--space-xs);
        border-top: 1px solid var(--koyn-border);
        text-align: right;
    }
    
    .read-more {
        color: var(--koyn-primary-light);
        font-size: 0.875rem;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s ease;
    }
    
    .read-more:hover {
        color: var(--koyn-primary);
        text-decoration: underline;
    }
    
    /* Sources section styling */
    .sources-section {
        margin-top: var(--space-xl);
        padding-top: var(--space-md);
        border-top: 1px solid var(--koyn-border);
        background-color: var(--koyn-bg-card);
        padding: var(--space-md) var(--space-lg);
        border-radius: var(--radius-md);
    }
    
    .sources-section h4 {
        font-size: 1.1rem;
        margin-bottom: var(--space-md);
        color: var(--koyn-text);
        font-weight: 600;
    }
    
    .sources-list {
        padding-left: var(--space-xl);
        margin-top: 0;
        margin-bottom: 0;
    }
    
    .sources-list li {
        margin-bottom: var(--space-sm);
        line-height: 1.4;
    }
    
    .sources-list li:last-child {
        margin-bottom: 0;
    }
    
    .sources-list a {
        color: var(--koyn-primary-light);
        text-decoration: none;
        transition: color 0.2s ease;
        font-weight: 500;
    }
    
    .sources-list a:hover {
        color: var(--koyn-primary);
        text-decoration: underline;
    }
    
    /* Loading indicator */
    .loading-indicator {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        right: 60px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--koyn-text-secondary);
        font-size: 0.9rem;
    }
    
    .loading-spinner {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(99, 102, 241, 0.2);
        border-top-color: var(--koyn-primary);
        border-radius: 50%;
        margin-right: var(--space-sm);
        animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    
    /* Responsive adjustments */
    @media (max-width: 768px) {
        .ai-search-header {
            flex-direction: column;
            align-items: flex-start;
        }
        
        .sentiment-indicator {
            margin-top: var(--space-sm);
            align-self: flex-start;
        }
        
        .news-tooltip {
            width: 280px;
        }
    }
    
    @media (max-width: 480px) {
        .ai-search-header h2 {
            font-size: 1.5rem;
        }
        
        .ai-search-summary h3 {
            font-size: 1.25rem;
        }
        
        .analysis-content {
            font-size: 1rem;
        }
        
        .news-tooltip {
            width: 250px;
            left: 0;
            transform: none;
        }
    }
    </style>
</body>
</html>
